name: Build macOS Release App

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach an app ZIP to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    name: Build Apple Silicon app
    runs-on: macos-15
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set release version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build and package FinderPlus
        run: APP_VERSION="${{ steps.version.outputs.version }}" ./bundle.sh

      - name: Verify Apple Silicon executable
        run: |
          file build/FinderPlus.app/Contents/MacOS/FinderPlus
          lipo -archs build/FinderPlus.app/Contents/MacOS/FinderPlus

      - name: Create downloadable ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/FinderPlus.app \
            "FinderPlus-${{ steps.version.outputs.version }}-macOS-arm64.zip"

      - name: Attach ZIP to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "FinderPlus-${{ steps.version.outputs.version }}-macOS-arm64.zip" \
            --repo "${{ github.repository }}" --clobber
